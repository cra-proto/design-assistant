<p-button [label]="'common.bulkActions' | translate" (onClick)="updateDropdown(); menu.toggle($event)" icon="pi pi-chevron-down" iconPos="right" outlined styleClass="secondary-outline h-3rem" />
<p-menu [model]="itemsDropdown" [popup]="true" #menu>
  <ng-template #submenuheader let-item>
    <span [class]="item.styleClass">{{ item.label | translate }}</span>
  </ng-template>
  <ng-template #item let-item>
    @if (item.type === 'booleanToggle') {
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
      <div (click)="$event.stopPropagation()" class="flex flex-row align-items-center justify-content-between gap-2">
        <a class="p-menu-item-link">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
        <div class="flex flex-row gap-1 mr-2">
          <p-button [disabled]="item.disabled" [label]="'common.yes' | translate" (onClick)="handleBoolToggle(item.onYes)" icon="pi pi-check" severity="success" text />
          <p-button [disabled]="item.disabled" [label]="'common.no' | translate" (onClick)="handleBoolToggle(item.onNo)" icon="pi pi-times" severity="danger" text />
        </div>
      </div>
    } @else {
      <a class="p-menu-item-link">
        <i [class]="item.icon"></i>
        <span>{{ item.label | translate }}</span>
      </a>
    }
  </ng-template>
</p-menu>

@if (selectedNode()) {
  <aida-edit-node [dialogMode]="true" [isOpen]="editingNode" [node]="selectedNode()!" (dialogClose)="editingNode = false" />
}
