<h1 id="wb-cont">{{ (hasName ? 'project._nav.edit' : 'project._nav.new') | translate }}</h1>

<!--Messages if user has required actions that affect the app globally-->
@if (!hasName) {
  <p-message icon="pi pi-info-circle font-bold" severity="info" styleClass="mb-2">
    {{ 'project.message.noName' | translate }}
  </p-message>
}
@if (!hasRepo) {
  <p-message icon="pi pi-info-circle font-bold" severity="info" styleClass="mb-2">
    {{ 'project.message.noRepo' | translate }}
  </p-message>
}

<!--Content-->
<div class="flex flex-column gap-3">
  <!--Row 1-->
  <div class="flex lg:flex-row flex-column gap-3">
    <!--Project Card-->
    <div class="surface-card border-round-lg shadow-2 p-4 w-full lg:w-4 min-w-min">
      <aida-setup-project />
    </div>
    <!--GitHub Card-->
    <div class="surface-card border-round-lg shadow-2 p-4 w-full lg:w-4 min-w-min">
      <aida-setup-repo />
    </div>
    <!--Collaborators Card-->
    <div class="surface-card border-round-lg shadow-2 p-4 w-full lg:w-4 min-w-min">
      <aida-add-collaborators mode="list" />
    </div>
  </div>

  <!--Row 2-->
  <div class="flex lg:flex-row flex-column gap-3">
    <!--Add Pages Card-->
    <div class="surface-card border-round-lg shadow-2 p-4 w-full lg:w-6 min-w-min">
      <aida-add-urls />
    </div>
    <!--Find Pages Card-->
    <div class="surface-card border-round-lg shadow-2 p-4 w-full lg:w-6 min-w-min">
      <aida-find-pages />
    </div>
  </div>

  <!--Row 3-->
  <!--Current Pages Card-->
  <div class="surface-card border-round-lg shadow-2 p-4 w-full min-w-min mb-2">
    <aida-view-pages />
  </div>
</div>
