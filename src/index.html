<!doctype html>
<html lang="en">
  <head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <title>AI Design Assistant (AIDA)</title>
    <base href="/" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="noindex, nofollow" name="robots" />
    <link href="images/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="images/favicon.ico" rel="icon" type="image/x-icon" />
    <meta content="AI Design Assistant (AIDA)" property="og:title" />
    <meta content="Manage bilingual web content design for Canada.ca" property="og:description" />
    <meta content="https://d1is7m1k5fsi95.cloudfront.net/images/social-preview.png" property="og:image" />
    <meta content="https://d1is7m1k5fsi95.cloudfront.net/" property="og:url" />
    <meta content="website" property="og:type" />
    <style>
      .pre-bootstrap-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }

      .pre-bootstrap-spinner {
        width: 80px;
        height: 80px;
        border: 6px solid #e2e8f0;
        border-top-color: #7636ab;
        border-radius: 50%;
        animation: pre-bootstrap-spin 0.8s linear infinite;
      }

      @keyframes pre-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body typeof="WebPage" vocab="http://schema.org/">
    <aida-root>
      <div class="pre-bootstrap-loader">
        <div class="pre-bootstrap-spinner"></div>
      </div>
    </aida-root>
  </body>
</html>
